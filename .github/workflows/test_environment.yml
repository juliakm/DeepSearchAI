# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions
# Script needs a resource group to deploy to with an associated federated credential. 
# @TODO: Resource Group variable
# Create secrets in advance in GitHub as Actions secrets:
# AZURE_CLIENT_ID: The appId from the service principal creation.
# AZURE_CLIENT_SECRET: The password from the service principal creation.
# AZURE_TENANT_ID: The tenant from the service principal creation.
# AZURE_SUBSCRIPTION_ID: The subscription ID you retrieved.
# AZURE_RESOURCE_GROUP: The resource group you will deploy to. 

name: Set up new test environment with Python app to Azure Web App - UUFSolver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade gunicorn uvicorn
        
      # Optional: Add step to run tests here (PyTest, Django test suites, etc.)

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r .env.sample

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: test
      url: ${{ steps.deploy-to-uuf-solver-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: unzip release.zip
      
      - name: Login to Azure using Federated Credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
          enable-AzPSSession: true

      - name: Check if Azure Cognitive Services account exists
        id: check_account
        run: |
          az cognitiveservices account show --name DeepSearchUUF-${{ github.run_id }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} || echo "Account does not exist"
        continue-on-error: true
  
      - name: Set account existence variable
        id: set_account_existence
        run: |
          if az cognitiveservices account show --name DeepSearchUUF-${{ github.run_id }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} > /dev/null 2>&1; then
            echo "ACCOUNT_EXISTS=true" >> $GITHUB_ENV
          else
            echo "ACCOUNT_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Deploy Bicep template
        id: deploy_bicep
        run: |
          az deployment group create \
            --name bicep-deployment-${{ github.run_id }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file main.bicep \
            --parameters @parameters.json \
            --parameters accountExists=${{ env.ACCOUNT_EXISTS }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Get deployment outputs
        id: get_outputs
        run: |
          outputs=$(az deployment group show --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --name bicep-deployment-${{ github.run_id }} --query properties.outputs)
          echo "WEB_APP_NAME=$(echo $outputs | jq -r .webAppName.value)" >> $GITHUB_ENV
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set SCM_DO_BUILD_DURING_DEPLOYMENT to true
        run: |
          az webapp config appsettings set --name ${{ env.WEB_APP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set environment variables from .env.sample file
        run: |
            while IFS= read -r line; do
              if [[ ! $line =~ ^# && ! -z $line ]]; then
                az webapp config appsettings set --name ${{ env.WEB_APP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --settings $line
              fi
            done < .env.sample
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}  

      - name: Wait for app settings to take effect
        run: sleep 30
    
      - name: 'Deploy to UUFSolver Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-uuf-solver-webapp
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: release.zip
